[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "appledetecting"
version = "1.0.0"
description = "Reproducible apple detection, HSV maturity grouping, depth estimation and mass proxy research demo"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {text = "MIT"}
dependencies = ["numpy>=1.24,<3", "pandas>=2,<3", "Pillow>=10,<12", "matplotlib>=3.7,<4", "scikit-learn>=1.3,<2", "streamlit>=1.35,<2"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.7"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 105
